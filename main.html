<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio - Marketino</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  
  
  <div id="navbar-placeholder"></div>
  
  <p class="intro-text">I'm Luka, aka a graphic & UI/UX designer with an <br> addiction to detail and a love for storytelling.</p>

  
  <div id="portfolioCarousel" class="carousel slide mx-auto" data-bs-ride="carousel" data-bs-interval="1500" data-bs-touch="false" data-bs-keyboard="false" style="max-width: 700px;">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="/images/marketino.png" class="d-block w-100" alt="Project 1">
      </div>
      <div class="carousel-item">
        <img src="/images/book_hub.png" class="d-block w-100" alt="Project 2">
      </div>
      <div class="carousel-item">
        <img src="/images/book_app.png" class="d-block w-100" alt="Project 3">
      </div>
      <div class="carousel-item">
        <img src="/images/marketino2.png" class="d-block w-100" alt="Project 3">
      </div>
      <div class="carousel-item">
        <img src="/images/tea_corner.png" class="d-block w-100" alt="Project 3">
      </div>
      <div class="carousel-item">
        <img src="/images/turster.png" class="d-block w-100" alt="Project 3">
      </div>
      <div class="carousel-item">
        <img src="/images/mekobre.png" class="d-block w-100" alt="Project 3">
      </div>
      
    </div>
  </div>

  
  
  
  <div class="mt-4">
    <p class="intro-text">Always searching new partners</p>
    <button class="btn btn-custom">
      Let's work together! →
    </button>
  </div>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    fetch('navbar.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('navbar-placeholder').innerHTML = html;
      });
  </script>

</body>
</html>
